name: Build Kurt Dhylan Moto Shop Inventory APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Verify project
        run: |
          test -f KurtDhylanMotoShopInventory.csproj
          test -f MauiProgram.cs
          test -f App.xaml.cs
          test -f Views/MainPage.cs
          test -f Resources/AppIcon/appicon.svg
          echo "Project structure OK"

      - name: Clean
        run: |
          rm -rf bin obj publish

      - name: Restore
        run: dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Publish ARM64 Android APK
        run: >-
          dotnet publish KurtDhylanMotoShopInventory.csproj
          -f net10.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:AndroidUseSharedRuntime=false
          -p:AndroidSupportedAbis=arm64-v8a
          -p:AndroidKeyStore=false
          -p:ApplicationDisplayVersion=1.0.1
          -p:ApplicationVersion=2
          -o ./publish
          --no-restore

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=$(find ./publish -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find ./publish -type f -print || true
            exit 1
          fi
          echo "APK generated: $APK"
          file "$APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KurtDhylanMotoShopInventory-Android15-ARM64-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
